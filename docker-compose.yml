services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: developer
      POSTGRES_DB: monolith
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d monolith"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    # The app exits 1 when the engine, settlement or HTTP server fails, and 0 after a
    # graceful shutdown on SIGTERM / SIGINT. on-failure restarts only the former; the
    # restarted app rebuilds the order book from the DB. Docker backs off between
    # restarts (100ms, doubling, up to 1 minute), so a crash loop doesn't spin.
    restart: on-failure
    env_file: envs/app/.env
    environment:
      # Overrides the localhost URL in envs/app/.env: inside the compose network the
      # database is reachable by its service name.
      DB_URL: "postgresql://developer:password@db:5432/monolith?sslmode=disable"
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Built from frontend/envs/.env. VITE_BACKEND_HOST is the API address as the browser
    # sees it (http://localhost:8080), not the compose service name.
    build: frontend
    restart: unless-stopped
    # The Vite dev server's port: the app's default CORS origin (HTTP_FRONTEND_HOST)
    # covers both. For npm run dev, start only db and app: docker compose up -d db app
    ports:
      - "5173:80"
    depends_on:
      - app
