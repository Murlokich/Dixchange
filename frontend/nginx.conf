server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts content-hashed files in assets/, so they never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (BrowserRouter): unknown paths get index.html, and React
    # Router picks the page. index.html itself is never cached, so a rebuild shows up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
