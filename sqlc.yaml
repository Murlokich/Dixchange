version: "2"
overrides:
  go:
    overrides:
      - db_type: "uuid"
        nullable: true
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "uuid"
        nullable: false
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "text"
        nullable: true
        go_type:
          type: "string"
          pointer: true
sql:
  - engine: "postgresql"
    queries: "./internal/auth/adapter/sql/user/queries.sql"
    schema: "./migrations"
    gen:
      go:
        out: "./internal/auth/adapter/sql/user"
        sql_package: "pgx/v5"
        omit_unused_structs: true