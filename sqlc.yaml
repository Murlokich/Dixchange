version: "2"
overrides:
  go:
    overrides:
      - db_type: "uuid"
        nullable: true
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "uuid"
        nullable: false
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "text"
        nullable: true
        go_type:
          type: "string"
          pointer: true
      - db_type: "pg_catalog.numeric"
        nullable: false
        go_type: 
          import: "github.com/shopspring/decimal"
          type: "Decimal"
sql:
  - engine: "postgresql"
    queries: "./internal/auth/adapter/sql/queries.sql"
    schema: "./migrations"
    gen:
      go:
        out: "./internal/auth/adapter/sql"
        sql_package: "pgx/v5"
        omit_unused_structs: true

  - engine: "postgresql"
    queries: "./internal/wallet/adapter/sql/queries.sql"
    schema: "./migrations"
    gen:
      go:
        out: "./internal/wallet/adapter/sql"
        sql_package: "pgx/v5"
        omit_unused_structs: true

  - engine: "postgresql"
    queries: "./internal/market/adapter/sql/queries.sql"
    schema: "./migrations"
    gen:
      go: 
        out: "./internal/market/adapter/sql"
        sql_package: "pgx/v5"
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "./internal/order/adapter/sql/queries.sql"
    schema: "./migrations"
    gen:
      go: 
        out: "./internal/order/adapter/sql"
        sql_package: "pgx/v5"
        omit_unused_structs: true